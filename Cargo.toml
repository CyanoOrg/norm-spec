[package]
name = "norm-spec"
description = "High-level Rust API for collecting and validating .norm files"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
readme = "README.md"
include = [
    "/Cargo.toml",
    "/LICENSE",
    "/README.md",
    "/README.zh-CN.md",
    "/crates/norm-api/src/**",
    "/schema/norm-schema.json",
    "/schema/profiles/*.json",
    "/templates/profiles/*.norm",
]

[lib]
path = "crates/norm-api/src/lib.rs"

[workspace]
members = ["crates/norm-core", "crates/norm-cli"]
default-members = [".", "crates/norm-core", "crates/norm-cli"]
resolver = "3"

[workspace.package]
version = "0.1.0-alpha.1"
edition = "2024"
rust-version = "1.97"
license = "MIT"
authors = ["Wade <bravetwo@163.com>"]
repository = "https://github.com/CyanoOrg/norm-spec"

[workspace.lints.rust]
missing_docs = "warn"
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
expect_used = "deny"
unwrap_used = "deny"

[dependencies]
norm-spec-core = { path = "crates/norm-core", version = "0.1.0-alpha.1" }
serde_json = "1.0.145"

[lints]
workspace = true
