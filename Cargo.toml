[workspace]
members = ["crates/norm-core", "crates/norm-cli"]
resolver = "3"

[workspace.package]
version = "0.1.0-alpha.1"
edition = "2024"
rust-version = "1.97"
license = "MIT"
authors = ["Wade <bravetwo@163.com>"]
repository = "https://github.com/CyanoOrg/norm-spec"

[workspace.lints.rust]
missing_docs = "warn"
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
expect_used = "deny"
unwrap_used = "deny"
