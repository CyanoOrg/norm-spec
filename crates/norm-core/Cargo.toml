[package]
name = "norm-spec-core"
description = "Canonical parser, collection, and validation engine for .norm files"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
readme = "README.md"
documentation = "https://docs.rs/norm-spec-core"
keywords = ["ai-agents", "conventions", "configuration", "validation"]
categories = ["config", "development-tools", "parser-implementations"]
publish = ["crates-io"]

[dependencies]
jsonschema = { version = "0.49.9", default-features = false }
serde = { version = "1.0.228", features = ["derive"] }
serde-saphyr = { version = "0.0.29", default-features = false, features = ["deserialize"] }
serde_json = "1.0.145"

[lints]
workspace = true
